roadmap:
  source: github-issues
  github:
    repo: pelaggio/pelaggio
    # Roadmap/pickup label = the autonomous MODE ("autopilot"), not the product — kept deliberately.
    label: autopilot
    plan-location: issue-comment
# auto-merge-pr queues `gh pr merge --auto`; branch protection requires `ci`
# (pinned to Actions) + `review` (unpinned, posted by the local subscription
# sweep). Supervision is retrospective — no admin bypass. See docs/pr-review.md.
ship:
  target: auto-merge-pr
revise:
  local: true
# Review gate runs on the local subscription (via #84), not the metered CI key.
# CI's `pr-review-ci` job gates off when repo var AUTOPILOT_REVIEW_RUNNER=local;
# the local pelaggio auto-pick sweep posts the `review` commit status.
#
# Native CI-key review + auto-merge (#258/#214) is BUILT and documented but NOT
# activated here: it is a repo-admin ops step, not a committed-config flip. The
# three moving parts must change TOGETHER — flipping `review.runner: ci` alone
# stops the local sweep posting while CI stays gated off (var still `local`), so
# `review` is never posted and every PR blocks. See the activation checklist:
# docs/pr-review.md#activating-native-ci-key-review-repo-admin.
review:
  runner: local
  # Opt-in; unattended authoring loops require key authentication.
  authoring:
    enabled: true
    # Three-reviewer panel restored 2026-08-05 after the grok Build top-up.
    # Caveat until #455 lands: a grok balance failure (402) has no distinct fault
    # class. Grok's own "Internal error" text passes through as a generic error_sdk,
    # so a grok seat failing at turn 1 means check the Build balance first.
    # (#434 is the concurrent-boot race — a different fault with the same symptom;
    # landing it will NOT fix this masking.)
    reviewers:
      - { id: claude, provider: claude }
      # No codex-model pin: this environment's Codex runs on a ChatGPT account
      # where 'gpt-5-codex' 400s; the CLI default is correct here.
      - { id: codex, provider: codex }
      - { id: grok, provider: grok }
  # Dogfooding posture: highest-quality gate, still auto-merging. Two independent
  # review iterations over a three-driver fan-out, with a structurally-different
  # scalar verifier.
  max-passes: 2
  # reservation = labels × drivers × (pr-review $5 + pr-verify $5), reserved per
  # iteration; budget-cap is the aggregate across passes. Red-team trigger doubles
  # labels: 2 × 3 × $10 = $60/iteration × 2 passes = $120. Sized to never preflight-
  # block the intended configuration. Review runs on the local subscription, so this
  # is a runaway governor, not a metered bill.
  budget-cap: 120
  # `require` blocks before agent work unless at least one review driver differs
  # from the verifier — makes the diversity structural rather than incidental.
  provider-diversity: require
budgets:
  shakedown-plan: 8
providers:
  grok:
    bin: ~/.grok/bin/grok
    allow-unsandboxed-fallback: true
# Authoring rotates cycle-locally across the configured pool. Review pools use
# the same drivers but deterministically exclude the realized artifact author.
# Coordination/recovery steps remain explicit static Claude pins.
models:
  profiles:
    standard:
      providers:
        pick: claude
        # Claude-conservation posture (2026-08-05): the token-heavy authoring
        # selection sets exclude Claude entirely and rotate grok/codex, with grok
        # first — it currently has the most subscription room. `implement` alone was
        # 52% of all-time spend, so this is where conservation actually bites.
        # These are selection sets: exactly one driver runs per cycle.
        plan: [grok, codex]
        shakedown-plan: [grok, codex]
        implement: [grok, codex]
        # Selection set, author-excluded: keeps the final code review cross-model
        # against a grok/codex implementation while dropping Claude's share from
        # 1-in-2 to 1-in-3.
        shakedown-code: [claude, grok, codex]
        ship: claude
        shipwreck: claude
        # Fan-out set: every driver runs the same discovery prompt concurrently and
        # every (driver × label) cell must return a valid PASS — all-pass/fail-closed.
        # Widened to three drivers 2026-08-06. The earlier two-driver rationale measured
        # cost *per pass* and concluded a third seat "adds cost without conserving Claude
        # (Claude runs either way)". True per pass; wrong for cost-to-land — under-enumeration
        # is what forces repeat gate runs, and Claude runs on every one. A third seat cuts the
        # number of passes, and the two added cells are grok (Build subscription), so Claude's
        # per-pass cell count is unchanged: we pay in a resource we have for one we don't.
        # Caveat: this is fail-closed, so an exhausted grok Build balance blocks every PR — a
        # 402 surfaces as `block (infra)`, not a real finding (see #428). Until #455 gives
        # balance-exhaustion its own non-blocking fault class, keep the Build balance funded.
        pr-review: [claude, codex, grok]
        # Scalar verifier, pinned off the pool's first entry (claude) so
        # provider-diversity: require is satisfied by construction.
        pr-verify: codex
    # Quick mode (S/XS/bug) skips plan+shakedown-plan and runs implement-only under
    # this profile. Its implement mirrors the standard profile's Claude-conservation
    # posture so small bugs lean on grok/codex too; a claude-* id is never forwarded
    # to those drivers, so each uses its own default model.
    quick:
      providers:
        pick: claude
        implement: [grok, codex]
        shakedown-code: [claude, grok, codex]
        ship: claude
        shipwreck: claude
