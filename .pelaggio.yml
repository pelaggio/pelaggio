roadmap:
  source: github-issues
  github:
    repo: pelaggio/pelaggio
    # Roadmap/pickup label = the autonomous MODE ("autopilot"), not the product — kept deliberately.
    label: autopilot
    plan-location: issue-comment
ship:
  target: pull-request
revise:
  local: true
# Review gate runs on the local subscription (via #84), not the metered CI key.
# CI's `pr-review-ci` job gates off when repo var AUTOPILOT_REVIEW_RUNNER=local;
# the local pelaggio auto-pick sweep posts the `review` commit status.
review:
  runner: local
budgets:
  shakedown-plan: 8
# Offload the token-heavy authoring steps to Codex (aggressive split). pick + ship
# stay on Claude: they are the prose-scrape coordination steps (parsePickResult /
# parseShipMerged) that are calibrated to Claude's prose — see coordination-spine.md.
# shakedown-code stays on Claude so the final code review is cross-model (Claude
# reviewing Codex's implementation). Codex model is left unset → Codex CLI default.
models:
  profiles:
    standard:
      providers:
        plan: codex
        shakedown-plan: codex
        implement: codex
