roadmap:
  source: github-issues
  github:
    repo: pelaggio/pelaggio
    # Roadmap/pickup label = the autonomous MODE ("autopilot"), not the product — kept deliberately.
    label: autopilot
    plan-location: issue-comment
ship:
  target: pull-request
revise:
  local: true
# Review gate runs on the local subscription (via #84), not the metered CI key.
# CI's `pr-review-ci` job gates off when repo var AUTOPILOT_REVIEW_RUNNER=local;
# the local pelaggio auto-pick sweep posts the `review` commit status.
#
# Native CI-key review + auto-merge (#258/#214) is BUILT and documented but NOT
# activated here: it is a repo-admin ops step, not a committed-config flip. The
# three moving parts must change TOGETHER — flipping `review.runner: ci` alone
# stops the local sweep posting while CI stays gated off (var still `local`), so
# `review` is never posted and every PR blocks. See the activation checklist:
# docs/pr-review.md#activating-native-ci-key-review-repo-admin.
review:
  runner: local
  # Local/supervised subscription runs use the panel+Judge authoring loop (#259).
  # Proper execution-context-aware enablement is tracked in #276; this is the local
  # dogfooding flip. grok is now a validated, format-reliable reviewer (single clean
  # block, caught a planted must-fix). With author=codex + judge=claude the role-
  # separation filter resolves the reviewer to grok — 3 distinct providers, and grok's
  # clean output sidesteps codex's #280 multi-block flake. If grok is unavailable the
  # filter falls back to codex/claude.
  authoring:
    enabled: true
    reviewers:
      - { id: claude, provider: claude }
      - { id: codex, provider: codex }
      - { id: grok, provider: grok }
    judge: { id: judge, provider: claude }
  # Safe rollout default is one pass. Opt in with max-passes: 2 after setting a
  # cap that can reserve every required discovery+verification call.
  max-passes: 1
  budget-cap: 20
  provider-diversity: off
budgets:
  shakedown-plan: 8
# Pin grok's off-PATH driver binary (#241) so grok steps/reviewer seats resolve it.
# allow-unsandboxed-fallback (#283): this host is WSL2 with no Landlock, so grok's own
# --sandbox can't apply; run it in the pelaggio jail (deny-env + cwd) for LOCAL SUPERVISED
# dogfooding only. Do NOT set this on unattended hosts.
providers:
  grok:
    bin: ~/.grok/bin/grok
    allow-unsandboxed-fallback: true
# Offload the token-heavy authoring steps to Codex (aggressive split). pick + ship
# stay on Claude: they are the prose-scrape coordination steps (parsePickResult /
# parseShipMerged) that are calibrated to Claude's prose — see coordination-spine.md.
# shakedown-code stays on Claude so the final code review is cross-model (Claude
# reviewing Codex's implementation). Codex model is left unset → Codex CLI default.
models:
  profiles:
    standard:
      providers:
        plan: codex
        shakedown-plan: codex
        implement: codex
    # Quick mode (S/XS/bug) skips plan+shakedown-plan and runs implement-only under
    # this profile. Offload that implement to Codex too so small bugs also lean on
    # Codex; the model stays Sonnet-priced in config but a claude-* id is never
    # forwarded, so Codex uses its CLI default.
    quick:
      providers:
        implement: codex
