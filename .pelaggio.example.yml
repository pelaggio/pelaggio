# .pelaggio.yml — see https://github.com/pelaggio/pelaggio/blob/main/docs/config.md
#
# All keys are optional. Defaults live in `DEFAULTS` in scripts/pelaggio/config.ts.
# Uncomment only the overrides you need.
#
# worktree:
#   prefix: my-project-
#
# budgets:
#   implement: 25
#
# ship:
#   target: pull-request # default: pull-request — keeps a human review gate in the loop.
#                        # Opt-in autonomous alternatives (each fires a loud one-time startup
#                        # banner — no human review gate):
#                        #   direct-push   squash-merge into local main and push to origin
#                        #   auto-merge-pr open a PR and auto-merge once CI passes
#
# revise:                # local revise sweep — auto-fix red-review PRs in-process (issue #76)
#   local: true          # default: true. Opt-out switch. A hard no-op unless the repo is
#                        # roadmap.source: github-issues AND a PR ship target AND auto-pick mode.
#
# notify:                # outbound run-outcome webhook (default: disabled)
#   url: https://ntfy.sh/my-pelaggio-topic
#   format: ntfy         # json (Slack/generic) | ntfy (phone push)
#   events:              # default: all five
#     - parked
#     - failed
#     - shipped
#     - pr-opened
#     - shipwrecked
