<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workbench</title>
<style>body{font:17px/1.6 system-ui;background:#f4f0e6;color:#071a2e;max-width:760px;margin:70px auto;padding:20px}h1{font-size:48px;letter-spacing:-2px}button,select{font:inherit;padding:8px;background:#fff;border:1px solid #0a6e60;border-radius:4px}li{padding:12px 0;border-bottom:1px solid #ccc}nav{display:flex;gap:15px;align-items:center}</style>
<h1>What’s on the workbench?</h1><label>Status <select id="status"><option value="">All</option><option>open</option><option>done</option></select></label><ul id="items"></ul><nav><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav>
<script type="module">
let page=1;const status=document.querySelector('#status');
async function render(){const data=await fetch(`/api/items?status=${encodeURIComponent(status.value)}&page=${page}`).then(r=>r.json());const list=document.querySelector('#items');list.replaceChildren();for(const item of data.items){const li=document.createElement('li');li.textContent=`${item.id} — ${item.title} · ${item.status}`;list.append(li)}document.querySelector('#page').textContent=`Page ${page} · ${data.total} items`;document.querySelector('#previous').disabled=page===1;document.querySelector('#next').disabled=page*10>=data.total;}
status.onchange=()=>{page=1;render()};document.querySelector('#previous').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};render();
</script></html>
