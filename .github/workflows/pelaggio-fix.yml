name: Pelaggio fix

on:
  issues:
    types: [labeled]

jobs:
  fix:
    if: github.event.label.name == 'autopilot:fix'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Credential split (#594): seat steps (model workers) run inside this checkout
      # (`--no-worktree`), so no token may persist into .git/config where a
      # prompt-injected seat could read it — persist-credentials would store the
      # job's contents:write token there for every later step. The harness's git
      # network ops get the same token step-scoped on "Run pelaggio" below instead.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify Claude seat host prerequisite
        run: |
          test "$(uname -s)" = Linux
          node --import tsx -e "const { resolveClaudeSeatBwrap } = await import('./packages/pelaggio/scripts/pelaggio/claude-seat.ts'); console.log(resolveClaudeSeatBwrap())"

      - name: Configure git
        run: |
          git config user.name "pelaggio[bot]"
          git config user.email "pelaggio[bot]@users.noreply.github.com"

      - name: Run pelaggio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CI: "true"
          # Override .pelaggio.yml's `review.authoring.enabled: local` (the reviewed
          # interactive/supervised intent): this CI runner has no Codex/Grok provider
          # keys, and CI-shipped PRs are gated by the cold pr-review path (the `review`
          # commit status), so the in-cycle authoring loop is redundant here. Without
          # this the `local` mode fail-closes at pre-flight (CI is an unattended signal).
          PELAGGIO_AUTHORING_ENABLED: "off"
          # Push credential for the harness's git network ops in this private repo —
          # the freshness `git fetch origin main` and ship's `git push -u origin HEAD`
          # (ship/pr-effects.ts). Same `github.token` the persisted checkout credential
          # carried before #594; now injected below via git's env-based config
          # (GIT_CONFIG_*) so it lives only in this step's process env, never on disk
          # in .git/config and never in git argv (`-c` flags land in error messages
          # and CI logs on failure). Step-scoped env, never job-level. The boundary:
          # the HARNESS process legitimately holds tokens (it already holds GH_TOKEN
          # above); SEAT children must not — spawnClaudeSeat strips GIT_CONFIG_*
          # while preserving it for the harness process that owns Git effects.
          PELAGGIO_PUSH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:${PELAGGIO_PUSH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${GIT_CONFIG_VALUE_0}"
          export GIT_CONFIG_VALUE_0
          unset PELAGGIO_PUSH_TOKEN
          pnpm pelaggio \
            --item "${{ github.event.issue.number }}" \
            --no-worktree \
            --target pull-request \
            --verbose

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "❌ Pelaggio run failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
