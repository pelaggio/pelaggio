name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # If the default GITHUB_TOKEN can't open PRs/issues on this self-hosted runner,
      # swap `token:` to `${{ secrets.RENOVATE_TOKEN }}` — a PAT scoped `repo` + `workflow`.
      - uses: renovatebot/github-action@eb932558ad942cccfd8211cf535f17ff183a9f74 # v46.1.9
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
