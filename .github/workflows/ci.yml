name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # GitHub-hosted (not self-hosted): CI runs on untrusted fork PRs once this
    # repo is public, so it must not execute on our own infrastructure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Provision Bubblewrap conformance
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - run: pnpm -r test
      - run: pnpm test:ci
      - run: pnpm typecheck
      - run: pnpm typecheck:ratchet -- --base-ref origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: pnpm typecheck:ratchet
        if: github.event_name != 'pull_request'
      - run: pnpm --filter @pelaggio/web build
      - run: pnpm --filter @pelaggio/site build
      - run: pnpm check
      - run: pnpm check:skills
      - run: pnpm check:trust
      - run: pnpm check:links
      - run: pnpm check:doc-claims
