name: PR review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# One in-flight review per PR; a new push supersedes the previous run.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The required branch-protection context is the `review` COMMIT STATUS, posted by
  # exactly one runner: this job in CI mode, or the local pelaggio runner in local
  # mode. This job id is deliberately NOT `review`: a *job* named `review` gated by a
  # job-level `if` scores as SUCCESS when skipped (GitHub treats a skipped required
  # check as passing), which in local mode would silently green the gate before the
  # local runner posts — a fail-open. Because no check-run is ever named `review`, a
  # skipped `pr-review-ci` job cannot satisfy the required `review` status context;
  # fail-closed-by-absence holds until the active runner posts the status.
  pr-review-ci:
    if: vars.AUTOPILOT_REVIEW_RUNNER != 'local'
    # GitHub-hosted, deliberately NOT self-hosted: the review agent executes
    # PR-influenced code (the CLI runs from the checked-out tree), so the job
    # must run on an ephemeral VM where the blast radius is one scoped token
    # plus a spend-capped API key — never on a dev machine. Free on public repos.
    runs-on: ubuntu-latest
    # Budget/turn caps only bind on completed turns — a hung SDK stream would
    # otherwise burn a runner for GitHub's 6h default.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      # Post the `review` commit status (the required context) for the head SHA.
      statuses: write

    steps:
      - name: Gate — same-repo, non-draft only
        id: gate
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && [ "${{ github.event.pull_request.draft }}" = "false" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping review (fork PR or draft) — will post a green review status. Secrets are unavailable to forks and forks can't be pelaggio PRs."
          fi

      # Post `pending` before any work so the gate blocks by presence while the review
      # runs; a crashed/cancelled job leaves this pending status = merge stays blocked.
      - name: Post pending review status
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -X POST -f state=pending -f context=review -f description="Automated review running"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The review seats run inside this checkout, so no token may persist into
          # .git/config: seat-env denial cannot reach an on-disk credential, and this job
          # holds statuses:write — a seat that read the extraheader could forge the very
          # `review` status this gate exists to produce. The harness's own fetch gets the
          # same token step-scoped below instead. Pairs with #594's split of
          # pelaggio-fix.yml; this is the same boundary on the review path.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Provision Bubblewrap conformance
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          sudo apt-get update
          sudo apt-get install -y bubblewrap
        if: steps.gate.outputs.run == 'true'

      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.gate.outputs.run == 'true'

      # The CLI produces the review, posts one PR comment, and exits non-zero on a
      # confirmed blocking finding (or on any refusal / SDK error — fail closed).
      # `continue-on-error` keeps the job green so the FINAL step can translate the
      # CLI outcome into the authoritative `review` commit status (the required
      # context) rather than the job's own `pr-review-ci` check-run.
      - name: Run review gate
        id: review
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately the built-in token, NOT the GH_TOKEN PAT: (a) the review
          # agent inherits this env, and the scoped token (comment, no push/merge)
          # bounds prompt-injection blast radius; (b) comments post as
          # github-actions[bot], so `--edit-last` can never clobber a human
          # comment from the PAT owner's account; (c) a PAT expiry can't turn the
          # required check red repo-wide.
          GH_TOKEN: ${{ github.token }}
          # Fetch credential for the harness's own git network ops — prepareReviewHead's
          # `git fetch origin main pull/<n>/head` in this private repo. Same github.token the
          # persisted checkout credential carried before; now injected through git's env-based
          # config so it lives only in this step's process env, never on disk in .git/config
          # and never in git argv (`-c` flags land in error messages and CI logs on failure).
          # Seats do not inherit it: GIT_CONFIG_KEY_*/GIT_CONFIG_VALUE_* are denied to Claude
          # seats by prefix (isGitAuthChannelVar) and are off the buildAgentEnv allowlist for
          # codex/grok.
          PELAGGIO_FETCH_TOKEN: ${{ github.token }}
          CI: "true"
        run: |
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:${PELAGGIO_FETCH_TOKEN}" | base64 -w0)"
          # Register the derived base64 form explicitly rather than relying on actions/checkout
          # having happened to setSecret the byte-identical blob for the same token input.
          echo "::add-mask::${GIT_CONFIG_VALUE_0}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0
          unset PELAGGIO_FETCH_TOKEN
          npx pelaggio pr-review --pr "${{ github.event.pull_request.number }}"

      # Translate the outcome into the required `review` status. Runs on success,
      # failure, and cancellation so the gate is never left merely `pending` by a
      # completed job. Fork/draft PRs (run=false) legitimately skip the agent and
      # post green — secrets are unavailable to forks and forks can't be pelaggio PRs.
      - name: Post final review status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            state=failure
            desc="Gate step failed (fail-closed)"
          elif [ "${{ steps.gate.outputs.run }}" != "true" ]; then
            state=success
            desc="Skipped (fork or draft PR) — no review required"
          elif [ "${{ steps.review.outcome }}" = "success" ]; then
            state=success
            desc="Automated review: PASS"
          else
            state=failure
            desc="Automated review: BLOCK or did not complete (fail-closed)"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -X POST -f state="$state" -f context=review -f description="$desc"

  local-mode-diagnostic:
    if: vars.AUTOPILOT_REVIEW_RUNNER == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Leave local-mode diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker='<!-- pelaggio-pr-review-local-mode -->'
          existing="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json comments --jq '.comments[].body | select(contains("'"$marker"'"))' | tail -n 1)"
          if [ -n "$existing" ]; then
            exit 0
          fi
          body_file="$(mktemp)"
          printf '%s\n%s\n' "$marker" "The required \`review\` status for this repo is posted by the local pelaggio runner, not CI." > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$body_file"
