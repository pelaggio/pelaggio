name: PR review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# One in-flight review per PR; a new push supersedes the previous run.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job id `review` == the required-status-check context. The job ALWAYS runs to
  # completion so the `review` check always reports green/red (never perpetually
  # pending). Fork/draft PRs skip the agent *inside* the job and still report
  # green — gating via a job-level `if` would leave a required check stuck pending.
  review:
    if: vars.AUTOPILOT_REVIEW_RUNNER != 'local'
    # GitHub-hosted, deliberately NOT self-hosted: the review agent executes
    # PR-influenced code (the CLI runs from the checked-out tree), so the job
    # must run on an ephemeral VM where the blast radius is one scoped token
    # plus a spend-capped API key — never on a dev machine. Free on public repos.
    runs-on: ubuntu-latest
    # Budget/turn caps only bind on completed turns — a hung SDK stream would
    # otherwise burn a runner for GitHub's 6h default.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Gate — same-repo, non-draft only
        id: gate
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && [ "${{ github.event.pull_request.draft }}" = "false" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping review (fork PR or draft) — reporting green. Secrets are unavailable to forks and forks can't be autopilot PRs."
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.gate.outputs.run == 'true'

      # The CLI produces the review, posts one PR comment, and exits non-zero on a
      # confirmed blocking finding (or on any refusal / SDK error — fail closed).
      # That exit code is the job result, hence the `review` check color.
      - name: Run review gate
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately the built-in token, NOT the GH_TOKEN PAT: (a) the review
          # agent inherits this env, and the scoped token (comment, no push/merge)
          # bounds prompt-injection blast radius; (b) comments post as
          # github-actions[bot], so `--edit-last` can never clobber a human
          # comment from the PAT owner's account; (c) a PAT expiry can't turn the
          # required check red repo-wide.
          GH_TOKEN: ${{ github.token }}
          CI: "true"
        run: npx @cdhorne/claude-autopilot pr-review --pr "${{ github.event.pull_request.number }}"

  local-mode-diagnostic:
    if: vars.AUTOPILOT_REVIEW_RUNNER == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Leave local-mode diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker='<!-- autopilot-pr-review-local-mode -->'
          existing="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json comments --jq '.comments[].body | select(contains("'"$marker"'"))' | tail -n 1)"
          if [ -n "$existing" ]; then
            exit 0
          fi
          body_file="$(mktemp)"
          printf '%s\n%s\n' "$marker" "The review gate is posted by the local autopilot runner for this repo." > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$body_file"
