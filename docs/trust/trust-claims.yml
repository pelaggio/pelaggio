# Pelaggio Trust Claim Registry — SINGLE SOURCE OF TRUTH
#
# The human trust docs, the machine-readable manifest (pelaggio.trust.json), and the
# CI verification job are all GENERATED from this file. Honest by construction: a
# claim's `status` must match what the code does TODAY — never what we wish it did.
#
# Status vocabulary (normative — use these words, nothing softer):
#   guarantee     — hard: a mechanism FAILS the operation if violated; proven by a test
#   default       — true out of the box, but the operator can change it
#   best_effort   — advisory/partial; not a hard gate
#   planned       — the endpoint intent; NOT yet true in shipped code
#   not_supported — explicitly out of scope
#
# Voice: "Fathom, lightened" — precise, grounded, a little air; never hype.

meta:
  schema_version: "0.1.0"
  source_audit: "internal (unpublished)"
  endpoint_intent: "internal (unpublished)"
  defining_threat: >
    Prompt-injection via untrusted input. Pelaggio is BUILT to read and act on
    repository files, issues, and PR text — surfaces an attacker can control. The
    core question isn't "is the agent contained?" but that the instructions
    themselves arrive from attacker-reachable places. Every capability is scoped on
    that assumption. (OWASP LLM01 Prompt Injection + LLM06 Excessive Agency +
    OWASP Top-10 for Agentic Applications, 2025.)

claims:
  # ---- What is already true (the good bones) --------------------------------
  - id: TC-001
    claim: "Known secret environment variables are not interpolated into prompts or structured run logs."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "Prompts are built from skill bodies + args (expandSkill/buildPrompt); provider and pipeline prompt/log paths do not read known secret env vars. The .jsonl log stores cycle metadata plus a bounded outputTail."
    evidence_command: "grep -En 'ANTHROPIC_API_KEY|LINEAR_API_KEY|GH_TOKEN|CONTROL_PLANE_TOKEN' packages/pelaggio/scripts/pelaggio/step-runner.ts packages/pelaggio/scripts/pelaggio/codex-provider.ts packages/pelaggio/scripts/pelaggio/pipeline.ts # expect: none"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/helpers.test.ts"
    failure_mode: "n/a — secrets are never read into these paths"
    known_limits: "Verbose (--verbose) transcripts in .dev/*.log (gitignored) capture raw child stdout; a secret the model echoes could land there. See TC-014."
    standards: ["OWASP-LLM02", "ASVS-V6"]
    adr: null
    last_verified: "2026-07-07"

  - id: TC-002
    claim: "No telemetry. Nothing phones home — there's no analytics to turn off because there's none to begin with."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "No analytics/telemetry SDK in dependencies; the word 'telemetry' appears only in code comments."
    evidence_command: "grep -rEn --include='*.ts' --include='package.json' --exclude-dir=node_modules 'sentry|posthog|mixpanel|amplitude|segment/analytics|datadog|honeycomb' package.json packages # expect: none"
    test_file: "ci/verify-claims.ts"
    failure_mode: "n/a"
    known_limits: "The optional notify webhook sends outcome metadata only, and only if you set notify.url."
    standards: ["GDPR-Art5"]
    adr: null
    last_verified: "2026-07-07"

  - id: TC-003
    claim: "The merge gate fails closed. A pull request merges only on an explicit 'Verdict: PASS' — silence, errors, or a refusal all block."
    status: guarantee
    applies_to: ">=0.1.0"
    condition: "ship.target = pull-request"
    mechanism: "parseReviewGate passes only on an explicit PASS from a successful run; BLOCK/missing/refusal/SDK-error/max-turns/park all block (helpers.ts:314-320). CI runs on an ephemeral VM with a comment-only token."
    evidence_command: "PELAGGIO_REPO=$PWD node --import tsx -e \"const h=await import('./packages/pelaggio/scripts/pelaggio/helpers.ts'); if(h.parseReviewGate('Verdict: PASS', true)!=='pass') process.exit(1); for (const [text, ok] of [['Verdict: PASS', false], ['Verdict: BLOCK', true], ['', true], ['Earlier\\\\nVerdict: PASS\\\\nLater\\\\nVerdict: BLOCK', true]]) if(h.parseReviewGate(text, ok)!=='block') process.exit(1)\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/helpers.test.ts"
    failure_mode: "blocks the merge, loudly"
    known_limits: "This is the review gate, distinct from the fail-safe shakedown parser. See TC-013 for auto-merge."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: "ADR-4"
    last_verified: "2026-07-07"

  - id: TC-004
    claim: "The published package runs no install scripts. Installing Pelaggio never executes code on your machine."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "checkPackageScripts rejects preinstall/install/postinstall; npm pack --ignore-scripts confirms the packed tree against an allowlist (check-publish.ts). The trust gate also checks every workspace manifest for those lifecycle hooks."
    evidence_command: "node -e \"const fs=require('fs');const paths=['package.json',...fs.readdirSync('packages').map(p=>'packages/'+p+'/package.json').filter(fs.existsSync)];const banned=['preinstall','install','postinstall'];for(const path of paths){const s=JSON.parse(fs.readFileSync(path,'utf8')).scripts||{};for(const key of banned)if(key in s){console.error(path+': '+key);process.exit(1)}}\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/check-publish.test.ts"
    failure_mode: "publish is blocked pre-release, loudly"
    known_limits: "Governs OUR manifest only; transitive dependencies can still run lifecycle scripts on a non---ignore-scripts install. See TC-016."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-6"
    last_verified: "2026-07-07"

  - id: TC-005
    claim: "Release workflow requires signed tags and npm provenance; live downstream attestation verification is not a local guarantee yet."
    status: best_effort
    applies_to: ">=0.1.0"
    mechanism: "publish.yml verifies an SSH-signed tag (git tag -v against allowed_signers), then npm publish --provenance (id-token: write)."
    evidence_command: "grep -q 'id-token: write' .github/workflows/publish.yml && grep -q 'git tag -v' .github/workflows/publish.yml && grep -q 'npm publish --provenance' .github/workflows/publish.yml"
    test_file: ".github/workflows/publish.yml"
    failure_mode: "publish aborts if the tag signature fails; provenance publication depends on the npm publish step"
    known_limits: "Self-hosted publish runner + automation token are the trust anchors (no interactive 2FA). Live npm attestation lookup is network-only, so it is not claimed as a local guarantee."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-7"
    last_verified: "2026-07-07"

  - id: TC-006
    claim: "Your code goes only where you point it: the model provider you configure, and the roadmap/notify integrations you enable. Nowhere else."
    status: default
    applies_to: ">=0.1.0"
    mechanism: "Egress is limited to the configured provider (today: Anthropic), the roadmap adapter (GitHub/Linear), git push to your remote, and an optional notify webhook. See the egress matrix in pelaggio.trust.json."
    evidence_command: "grep -rEn '@anthropic-ai/claude-agent-sdk|LinearClient|gh |git push origin|notify\\.url|fetch\\(' packages/pelaggio/scripts/pelaggio .github/workflows"
    test_file: "docs/trust/trust-claims.yml"
    failure_mode: "n/a"
    known_limits: "Self-hosted keeps everything on your infra; the model provider's retention is governed by their policy."
    standards: ["GDPR-Art28", "OWASP-LLM02"]
    adr: null
    last_verified: "2026-07-07"

  # ---- The endpoint intent (planned — NOT yet true; honest labels) ----------
  - id: TC-010
    claim: "On a routable interface the control plane never runs unauthenticated: with no token set it refuses to start. (Loopback stays allowed for local dev, with a boot warning.)"
    status: guarantee          # closed by #102 (F1), merged 2026-07-08
    applies_to: ">=0.1.0"
    mechanism: "loadServerConfig() throws when CONTROL_PLANE_TOKEN is unset AND the host is non-loopback; loopback is classified by parsed IP literal (node:net isIP): a valid 127.0.0.0/8 IPv4 literal, ::1, or the exact host 'localhost' (packages/server/src/config.ts)."
    evidence_command: "grep -q 'isIP' packages/server/src/config.ts && grep -q 'CONTROL_PLANE_TOKEN is unset' packages/server/src/config.ts && node --import tsx --test --test-reporter=dot packages/server/__tests__/config.test.ts >/dev/null"
    test_file: "packages/server/__tests__/config.test.ts (fail-closed + adversarial 127.*-hostname cases)"
    failure_mode: "refuse to start, loudly (throws an actionable error)"
    known_limits: "Loopback-without-token is intentionally allowed for local dev (a boot warn fires). Conservative: IPv4-mapped loopback (::ffff:127.0.0.1) is refused rather than parsed."
    standards: ["ASVS-V2", "OWASP-LLM06"]
    adr: "ADR-8"
    last_verified: "2026-07-08"

  - id: TC-011
    claim: "By default, writes are confined to the work item's own worktree: main-checkout or sibling changes fail the step. Dirty-main mode retains sibling enforcement and provider-specific main protection."
    status: guarantee          # shipped: pipeline.ts post-step confinement audit (#105/#111/#125), tested
    applies_to: ">=0.1.0"
    mechanism: "Post-step hard gate (pipeline.ts): forbiddenRootsForStep enumerates main + sibling worktrees (minus the item's own worktree) and diffs their Git state. In confinement.allow-dirty-main item-worktree steps, siblings retain that gate; Claude brackets mutating tools with main Git snapshots through RunStepOpts, while Codex excludes main through workspace-write. Deltas, lifecycle errors, and snapshot errors fail closed."
    evidence_command: "grep -q 'snapshotForbiddenRoots' packages/pelaggio/scripts/pelaggio/pipeline.ts && grep -q 'diffForbiddenRootSnapshots' packages/pelaggio/scripts/pelaggio/pipeline.ts && grep -q 'error_confinement' packages/pelaggio/scripts/pelaggio/pipeline.ts && node --import tsx --test --test-name-pattern='confinement' packages/pelaggio/scripts/pelaggio/__tests__/pipeline.test.ts >/dev/null 2>&1"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/{helpers,step-runner,pipeline}.test.ts (observer state; hook correlation; attributed-main, sibling, enumeration, and precedence failures)"
    failure_mode: "fail the step, loudly (subtype error_confinement)"
    known_limits: "Tool-window deltas are conservative attribution, not writer or process-lifetime provenance: simultaneous operator changes inside a window fail closed, detached/background writes after its post hook are outside the window, and paths outside audited Git roots are never caught. Future providers that can reach main must bracket mutations through the observer."
    standards: ["OWASP-LLM06", "OWASP-LLM05"]
    adr: "ADR-1, ADR-2"
    last_verified: "2026-07-07"

  - id: TC-012
    claim: "Human-gated by default. Out of the box it opens a pull request — it never pushes to your main branch unless you explicitly opt in."
    status: guarantee          # closed by #114 (S2), merged 2026-07-08
    applies_to: ">=0.1.0"
    mechanism: "ship.target resolves to DEFAULT_SHIP_TARGET = 'pull-request' when unset; direct-push/auto-merge-pr are explicit opt-ins that fire a loud one-time startup banner (config.ts, pipeline.ts)."
    evidence_command: "PELAGGIO_REPO=$PWD node --import tsx -e \"const cfg=await import('./packages/pelaggio/scripts/pelaggio/config.ts'); const ship=await import('./packages/pelaggio/scripts/pelaggio/ship/index.ts'); if(cfg.DEFAULT_SHIP_TARGET!=='pull-request') process.exit(1); if(ship.isAutonomousRemotePush(cfg.DEFAULT_SHIP_TARGET)) process.exit(1)\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/ship.test.ts (default target + autonomous-push warning)"
    failure_mode: "n/a (safe default; autonomous push is an explicit, warned opt-in)"
    known_limits: "direct-push and auto-merge-pr remain available as explicit, warned opt-ins."
    standards: ["OWASP-LLM06"]
    adr: "ADR-3"
    last_verified: "2026-07-08"

  - id: TC-013
    claim: "Auto-merge only ever merges after the required review gate passes."
    status: planned            # TODAY (S3): relies on unverified branch protection
    applies_to: "planned"
    mechanism: "INTENDED: verify branch-protection / required 'review' check at auto-merge setup; refuse or warn if unprotected."
    evidence_command: "grep -rEn 'auto-merge|branch-protection|required.*review|pr.automerge|ship.target' docs/trust docs/decisions packages/pelaggio/scripts/pelaggio"
    test_file: "planned"
    failure_mode: "warn/refuse if the gate isn't enforceable"
    known_limits: "TODAY safety is delegated to GitHub branch-protection settings that live outside the repo and are not verified in-code."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: "ADR-5"
    last_verified: "2026-07-07"

  - id: TC-014
    claim: "Child processes get only the secrets they need, and logs are scrubbed of anything that looks like a credential."
    status: planned            # TODAY (S4): full process.env inherited; no redaction
    applies_to: "planned"
    mechanism: "INTENDED: minimal env allowlist to spawned children; redact known secret patterns from log streams."
    evidence_command: "grep -rEn 'process\\.env|spawn\\(|execFileSync|outputTail|redact|scrub' packages/pelaggio/scripts/pelaggio"
    test_file: "planned"
    failure_mode: "redacted before write"
    known_limits: "TODAY the full parent env is inherited by spawned children and no log stream is scrubbed."
    standards: ["OWASP-LLM02", "12FACTOR-Config"]
    adr: "ADR-10"
    last_verified: "2026-07-07"

  # ---- The defining threat, as a first-class claim --------------------------
  - id: TC-015
    claim: "Pelaggio treats everything in your repo, issues, and PRs as untrusted input — text that could be trying to steer the agent — and bounds what it can do accordingly."
    status: best_effort        # partially: worktree hooks + gates; not yet a designed injection defense
    applies_to: ">=0.1.0 (best_effort); hardening planned"
    mechanism: "Today: worktree hooks (TC-011), fail-closed review gate (TC-003), and budget/turn caps bound blast radius. Not yet: a designed prompt-injection defense (input provenance, tool-scoping by trust level, output handling)."
    evidence_command: "grep -rEn 'PreToolUse|parseReviewGate|TURN_LIMITS|BUDGETS|SECURITY_PATHS|prompt injection' packages/pelaggio/scripts/pelaggio docs/trust"
    test_file: "planned — injection corpus / red-team fixtures"
    failure_mode: "bounded by the gates above, not by injection-specific detection"
    known_limits: "This is the DEFINING threat and the honest weak point: the agent runs allow-all tools over attacker-reachable content. Hardening (least-privilege tools, human gates on risky file classes) is the roadmap headline."
    standards: ["OWASP-LLM01", "OWASP-LLM05", "OWASP-Agentic-2025"]
    adr: "ADR-2"
    last_verified: "2026-07-07"

  # ---- Supply-chain honesty -------------------------------------------------
  - id: TC-016
    claim: "We tell you the truth about the dependency tree: our package ships no install scripts, but transitive dependencies can, on a normal install."
    status: best_effort
    applies_to: ">=0.1.0"
    mechanism: "TC-004 governs our manifest; consumer/CI installs run without --ignore-scripts except pr-review.yml, so transitive lifecycle scripts still execute."
    evidence_command: "grep -rEn 'ignore-scripts' .github/workflows"
    test_file: "n/a"
    failure_mode: "documented, not gated"
    known_limits: "Also: LINEAR_API_KEY has no standard prefix and isn't in the tarball secret scan (M1)."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-6"
    last_verified: "2026-07-07"

manifest:
  defaults:
    ship_target: pull-request
    telemetry: off
    control_plane_auth: required_or_loopback_only
  capabilities:
    - id: repo.read
      description: "Read repository files, local configuration, and roadmap context needed to plan or verify work."
      default: allowed
      scope: local_repo_only
      approval: not_required
      evidence: [TC-015]
    - id: repo.write.worktree
      description: "Create/edit files while working an item."
      default: allowed
      scope: item_worktree_only
      approval: not_required
      evidence: [TC-011, TC-015]
    - id: shell.exec.worktree
      description: "Run shell commands while working an item. The high-trust capability; scoped to the worktree and bounded by budget/turn caps."
      default: allowed
      scope: item_worktree_only
      approval: not_required
      evidence: [TC-011, TC-015]
    - id: pr.open
      description: "Open a pull request with the item's work."
      default: allowed
      approval: not_required
      evidence: [TC-003, TC-012]
    - id: git.push.default_branch
      description: "Push directly to the repo's default branch."
      default: denied
      approval: explicit_config_required
      evidence: [TC-012]
    - id: pr.automerge
      description: "Auto-merge a PR once checks pass."
      default: denied
      approval: explicit_config_required
      evidence: [TC-013]
    - id: control_plane.spawn_run
      description: "Spawn an orchestrator run via the control-plane API."
      default: denied
      scope: authenticated_or_loopback_only
      approval: explicit_config_required
      evidence: [TC-010]
  egress:
    - destination: anthropic
      data_categories: [prompts, repo_paths, source_context, diffs, issue_text]
      required: true
      retention: "governed by the provider's policy"
      opt_out: "configure a different model provider when one is supported"
      role: sub_processor
      evidence: [TC-006]
    - destination: github
      data_categories: [issues, pull_requests, plan_bodies, diffs, comments]
      required: false
      retention: "your GitHub"
      opt_out: "use a different roadmap adapter"
      role: user_controlled_endpoint
      evidence: [TC-006, TC-003]
    - destination: linear
      data_categories: [issues, comments, state]
      required: false
      retention: "your Linear workspace"
      opt_out: "use a different roadmap adapter"
      role: user_controlled_endpoint
      evidence: [TC-006]
    - destination: git_remote
      data_categories: [commits, branches]
      required: false
      retention: "your remote"
      opt_out: "n/a - your own remote"
      role: user_controlled_endpoint
      evidence: [TC-006, TC-012]
    - destination: notify_webhook
      data_categories: [outcome_metadata]
      required: false
      retention: "your endpoint"
      opt_out: "leave notify.url unset"
      role: user_controlled_endpoint
      evidence: [TC-006]
  never:
    - statement: "push to your default branch by default"
      evidence: [TC-012]
    - statement: "send telemetry or analytics"
      evidence: [TC-002]
    - statement: "interpolate known secret environment variables into prompts or structured run logs"
      evidence: [TC-001]
    - statement: "run install scripts from our published package"
      evidence: [TC-004]
    - statement: "merge a pull request the review gate did not pass in pull-request mode"
      evidence: [TC-003, TC-013]
  provenance:
    npm_provenance: true
    signed_tag: true
    sigstore_bundle: planned
    evidence: [TC-005]
  permission_tiers:
    - id: local_read
      description: "Read repository files and local configuration needed to plan or verify work."
      default: true
      capabilities: [repo.read]
      evidence: [TC-015]
    - id: worktree_write
      description: "Write files and run commands inside the claimed worktree."
      default: true
      capabilities: [repo.write.worktree, shell.exec.worktree]
      evidence: [TC-011, TC-015]
    - id: remote_mutation
      description: "Open PRs by default; direct push and auto-merge require explicit ship.target opt-in."
      default: false
      capabilities: [pr.open, git.push.default_branch, pr.automerge]
      evidence: [TC-003, TC-012, TC-013]
  sandbox_scope:
    worktree_scope: "item worktree by convention and hooks; the post-step audit always gates siblings and gates main by default"
    main_repo_protection: "default post-step Git-state diff fails on main changes; dirty-main mode uses Claude mutating-tool delta attribution or Codex workspace exclusion while retaining sibling enforcement"
    planned_hardening: "not an OS/container sandbox: writes to paths outside any tracked git root (e.g. $HOME, /tmp, arbitrary absolute paths) are not caught by this audit and remain bounded by tool/egress scoping (TC-015)"
    evidence: [TC-011, TC-015]
