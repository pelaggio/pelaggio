# Pelaggio Trust Claim Registry — SINGLE SOURCE OF TRUTH
#
# The human trust docs, the machine-readable manifest (pelaggio.trust.json), and the
# CI verification job are all GENERATED from this file. Honest by construction: a
# claim's `status` must match what the code does TODAY — never what we wish it did.
#
# Status vocabulary (normative — use these words, nothing softer):
#   guarantee     — hard: a mechanism FAILS the operation if violated; proven by a test
#   default       — true out of the box, but the operator can change it
#   best_effort   — advisory/partial; not a hard gate
#   planned       — the endpoint intent; NOT yet true in shipped code
#   not_supported — explicitly out of scope
#
# Voice: "Fathom, lightened" — precise, grounded, a little air; never hype.

meta:
  schema_version: "0.1.0"
  source_audit: "internal (unpublished)"
  endpoint_intent: "internal (unpublished)"
  defining_threat: >
    Prompt-injection via untrusted input. Pelaggio is BUILT to read and act on
    repository files, issues, and PR text — surfaces an attacker can control. The
    core question isn't "is the agent contained?" but that the instructions
    themselves arrive from attacker-reachable places. Every capability is scoped on
    that assumption. (OWASP LLM01 Prompt Injection + LLM06 Excessive Agency +
    OWASP Top-10 for Agentic Applications, 2025.)

claims:
  # ---- What is already true (the good bones) --------------------------------
  - id: TC-001
    claim: "Known secret environment variables are not interpolated into prompts or structured run logs."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "Prompts are built from skill bodies + args (expandSkill/buildPrompt); provider and pipeline prompt/log paths do not read known secret env vars. The .jsonl log stores cycle metadata plus a bounded outputTail."
    evidence_command: "grep -En 'ANTHROPIC_API_KEY|LINEAR_API_KEY|GH_TOKEN|CONTROL_PLANE_TOKEN' packages/pelaggio/scripts/pelaggio/step-runner.ts packages/pelaggio/scripts/pelaggio/providers/claude.ts packages/pelaggio/scripts/pelaggio/providers/codex.ts packages/pelaggio/scripts/pelaggio/pipeline.ts # expect: none"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/skills.test.ts"
    failure_mode: "n/a — secrets are never read into these paths"
    known_limits: "Verbose (--verbose) transcripts in .dev/*.log (gitignored) capture raw child stdout; as of TC-014 that sink is secret-scrubbed before write, but a novel credential format the scrubber does not recognize could still land there."
    standards: ["OWASP-LLM02", "ASVS-V6"]
    adr: null
    last_verified: "2026-07-07"

  - id: TC-002
    claim: "No telemetry. Nothing phones home — there's no analytics to turn off because there's none to begin with."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "No analytics/telemetry SDK in dependencies; the word 'telemetry' appears only in code comments."
    evidence_command: "grep -rEn --include='*.ts' --include='package.json' --exclude-dir=node_modules 'sentry|posthog|mixpanel|amplitude|segment/analytics|datadog|honeycomb' package.json packages # expect: none"
    test_file: "ci/verify-claims.ts"
    failure_mode: "n/a"
    known_limits: "The optional notify webhook sends outcome metadata only, and only if you set notify.url."
    standards: ["GDPR-Art5"]
    adr: null
    last_verified: "2026-07-07"

  - id: TC-003
    claim: "The merge gate fails closed. Only validated review reports without 'must-fix' findings pass; malformed output, errors, or refusal block."
    status: guarantee
    applies_to: ">=0.1.0"
    condition: "ship.target = pull-request"
    mechanism: "parseReviewFindings validates the versioned closed schema; reviewFindingsGate blocks only must-fix while step and parse failures block in pr-review-gate.ts. CI publishes the compatibility review status."
    evidence_command: "PELAGGIO_REPO=$PWD node --import tsx -e \"const f=await import('./packages/pelaggio/scripts/pelaggio/review/findings.ts'); const block=(findings)=>'REVIEW_FINDINGS\\\\n'+JSON.stringify({schemaVersion:1,summary:'Reviewed.',findings})+'\\\\nEND_REVIEW_FINDINGS'; for (const findings of [[],[{severity:'nice',message:'Improve.'}],[{severity:'note',message:'Context.'}]]) if(f.reviewFindingsGate(f.parseReviewFindings(block(findings)))!=='pass') process.exit(1); if(f.reviewFindingsGate(f.parseReviewFindings(block([{severity:'must-fix',message:'Bug.'}])))!=='block') process.exit(1); try { f.parseReviewFindings('malformed'); process.exit(1) } catch {}\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/review-findings.test.ts"
    failure_mode: "blocks the merge, loudly"
    known_limits: "This is the review gate, distinct from the fail-safe shakedown parser. See TC-013 for auto-merge."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: "ADR-4"
    last_verified: "2026-07-07"

  - id: TC-004
    claim: "The published package runs no install scripts. Installing Pelaggio never executes code on your machine."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "checkPackageScripts rejects preinstall/install/postinstall; npm pack --ignore-scripts confirms the packed tree against an allowlist (check-publish.ts). The trust gate also checks every workspace manifest for those lifecycle hooks."
    evidence_command: "node -e \"const fs=require('fs');const paths=['package.json',...fs.readdirSync('packages').map(p=>'packages/'+p+'/package.json').filter(fs.existsSync)];const banned=['preinstall','install','postinstall'];for(const path of paths){const s=JSON.parse(fs.readFileSync(path,'utf8')).scripts||{};for(const key of banned)if(key in s){console.error(path+': '+key);process.exit(1)}}\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/check-publish.test.ts"
    failure_mode: "publish is blocked pre-release, loudly"
    known_limits: "Governs OUR manifest only; transitive dependencies can still run lifecycle scripts on a non---ignore-scripts install. See TC-016."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-6"
    last_verified: "2026-07-07"

  - id: TC-005
    claim: "Release workflow requires signed tags and npm provenance; live downstream attestation verification is not a local guarantee yet."
    status: best_effort
    applies_to: ">=0.1.0"
    mechanism: "publish.yml verifies an SSH-signed tag (git tag -v against allowed_signers), then npm publish --provenance (id-token: write)."
    evidence_command: "grep -q 'id-token: write' .github/workflows/publish.yml && grep -q 'git tag -v' .github/workflows/publish.yml && grep -q 'npm publish --provenance' .github/workflows/publish.yml"
    test_file: ".github/workflows/publish.yml"
    failure_mode: "publish aborts if the tag signature fails; provenance publication depends on the npm publish step"
    known_limits: "Self-hosted publish runner + automation token are the trust anchors (no interactive 2FA). Live npm attestation lookup is network-only, so it is not claimed as a local guarantee."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-7"
    last_verified: "2026-07-07"

  - id: TC-006
    claim: "Your code goes only where you point it: the model provider you configure, and the roadmap/notify integrations you enable. Nowhere else."
    status: default
    applies_to: ">=0.1.0"
    mechanism: "Egress is limited to the configured model provider (Claude/Anthropic, Codex/OpenAI, or Grok/the operator-configured compatible endpoint), the roadmap adapter (GitHub/Linear), git push to your remote, and an optional notify webhook. Grok's managed profile and --disable-web-search restrict child/tool traffic, but its in-process model client remains provider egress. See the egress matrix in pelaggio.trust.json."
    evidence_command: "grep -rEn '@anthropic-ai/claude-agent-sdk|LinearClient|gh |git push origin|notify\\.url|fetch\\(' packages/pelaggio/scripts/pelaggio .github/workflows"
    test_file: "docs/trust/trust-claims.yml"
    failure_mode: "n/a"
    known_limits: "Self-hosted means Pelaggio adds no hosted control plane, but the selected model provider still receives legitimate prompt and read-file/source context under its retention policy. For Grok 0.2.103, cli-chat-proxy.grok.com is observed and release-conformance-locked, not kernel- or L7-allowlisted; #279/#260 own constrained-broker routing. The unsandboxed Grok fallback is local-supervised only and makes no unattended containment claim."
    standards: ["GDPR-Art28", "OWASP-LLM02"]
    adr: null
    last_verified: "2026-07-07"

  # ---- Control-plane authentication -----------------------------------------
  - id: TC-010
    claim: "The control plane never runs unauthenticated: with no token set it refuses to start, including on loopback."
    status: guarantee          # closed by #102 (F1), strengthened by #500
    applies_to: ">=0.1.0"
    mechanism: "loadServerConfig() requires CONTROL_PLANE_TOKEN before the daemon starts on any host (packages/server/src/config.ts); bearerAuth() guards every authority-bearing API route. Health, the public trust manifest, and the static UI shell carry no run authority and intentionally bypass it."
    evidence_command: "grep -q 'required(\"CONTROL_PLANE_TOKEN\"' packages/server/src/config.ts && node --import tsx --test --test-reporter=dot packages/server/__tests__/config.test.ts packages/server/__tests__/auth.test.ts >/dev/null"
    test_file: "packages/server/__tests__/{config,auth}.test.ts (mandatory token on loopback/routable hosts + bearer validation)"
    failure_mode: "refuse to start, loudly (throws an actionable error)"
    known_limits: "The health endpoint, public trust manifest, and static UI shell intentionally bypass bearer auth; none can invoke authority-bearing actions without the token. The web UI stores its operator-supplied token in localStorage, so XSS can disclose it."
    standards: ["ASVS-V2", "OWASP-LLM06"]
    adr: "ADR-8"
    last_verified: "2026-08-11"

  - id: TC-011
    claim: "By default, writes are confined to the work item's own worktree: main-checkout or sibling changes fail the step. Dirty-main mode retains sibling enforcement and provider-specific main protection."
    status: guarantee          # shipped: pipeline.ts post-step confinement audit (#105/#111/#125), tested
    applies_to: ">=0.1.0"
    mechanism: "Post-step hard gate (pipeline.ts): forbiddenRootsForStep enumerates main + sibling worktrees (minus the item's own worktree) and diffs their Git state. In confinement.allow-dirty-main item-worktree steps, siblings retain that gate; Claude brackets mutating tools with main Git snapshots through RunStepOpts, while Codex excludes main through workspace-write. Deltas, lifecycle errors, and snapshot errors fail closed."
    evidence_command: "grep -q 'snapshotForbiddenRoots' packages/pelaggio/scripts/pelaggio/pipeline.ts && grep -q 'diffForbiddenRootSnapshots' packages/pelaggio/scripts/pelaggio/pipeline.ts && grep -q 'error_confinement' packages/pelaggio/scripts/pelaggio/pipeline.ts && node --import tsx --test --test-name-pattern='confinement' packages/pelaggio/scripts/pelaggio/__tests__/pipeline.test.ts >/dev/null 2>&1"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/{helpers,step-runner,pipeline}.test.ts (observer state; hook correlation; attributed-main, sibling, enumeration, and precedence failures)"
    failure_mode: "fail the step, loudly (subtype error_confinement)"
    known_limits: "Tool-window deltas are conservative attribution, not writer or process-lifetime provenance: simultaneous operator changes inside a window fail closed, detached/background writes after its post hook are outside the window, and paths outside audited Git roots are never caught. Future providers that can reach main must bracket mutations through the observer."
    standards: ["OWASP-LLM06", "OWASP-LLM05"]
    adr: "ADR-1, ADR-2"
    last_verified: "2026-08-03"

  - id: TC-012
    claim: "Human-gated by default. Out of the box it opens a pull request — it never pushes to your main branch unless you explicitly opt in."
    status: guarantee          # closed by #114 (S2), merged 2026-07-08
    applies_to: ">=0.1.0"
    mechanism: "ship.target resolves to DEFAULT_SHIP_TARGET = 'pull-request' when unset; direct-push/auto-merge-pr are explicit opt-ins that fire a loud one-time startup banner (config.ts, pipeline.ts)."
    evidence_command: "PELAGGIO_REPO=$PWD node --import tsx -e \"const cfg=await import('./packages/pelaggio/scripts/pelaggio/config.ts'); const ship=await import('./packages/pelaggio/scripts/pelaggio/ship/index.ts'); if(cfg.DEFAULT_SHIP_TARGET!=='pull-request') process.exit(1); if(ship.isAutonomousRemotePush(cfg.DEFAULT_SHIP_TARGET)) process.exit(1)\""
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/ship.test.ts (default target + autonomous-push warning)"
    failure_mode: "n/a (safe default; autonomous push is an explicit, warned opt-in)"
    known_limits: "direct-push and auto-merge-pr remain available as explicit, warned opt-ins."
    standards: ["OWASP-LLM06"]
    adr: "ADR-3"
    last_verified: "2026-07-08"

  - id: TC-013
    claim: "Auto-merge only ever merges after the required review gate passes."
    status: planned            # TODAY (S3): relies on unverified branch protection
    applies_to: "planned"
    mechanism: "INTENDED: verify branch-protection / required 'review' check at auto-merge setup; refuse or warn if unprotected."
    evidence_command: "grep -rEn 'auto-merge|branch-protection|required.*review|pr.automerge|ship.target' docs/trust docs/decisions packages/pelaggio/scripts/pelaggio"
    test_file: "planned"
    failure_mode: "warn/refuse if the gate isn't enforceable"
    known_limits: "TODAY safety is delegated to GitHub branch-protection settings that live outside the repo and are not verified in-code."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: "ADR-5"
    last_verified: "2026-07-07"

  - id: TC-014
    claim: "Child processes get only the secrets they need, and logs are scrubbed of anything that looks like a credential."
    status: guarantee
    applies_to: ">=0.1.0"
    mechanism: "Spawned driver subprocesses receive a deny-by-default allowlisted env (buildAgentEnv in secret-hygiene.ts) — PATH/HOME plus locale/terminal and certificate passthrough and explicitly configured vars only, never the full parent process.env. Claude children are filtered at the unconditional spawnClaudeSeat seam (and its preflight probe) the same way; they extra-pass fixed named sets only: direct Anthropic token vars (ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN) only when no third-party provider mode is active; the provider-independent workload-identity-federation/profile set; named non-secret SDK control markers; non-secret provider-mode selectors and configuration (CLAUDE_CODE_USE_*/CLAUDE_CODE_SKIP_*_AUTH, base-URL overrides, project/region/workspace ids, CLAUDE_CONFIG_DIR); explicit metadata-credential suppression controls (AWS_EC2_METADATA_DISABLED, METADATA_SERVER_DETECTION); and pelaggio harness config (PELAGGIO_REPO, PELAGGIO_WORKTREE_PREFIX, PELAGGIO_AUTHORING_ENABLED, and the PELAGGIO_TAXONOMY_PUBKEY public trust anchor). Third-party provider credentials are mode-and-auth-gated: ANTHROPIC_FOUNDRY_API_KEY and ANTHROPIC_FOUNDRY_AUTH_TOKEN pass only under Foundry mode without CLAUDE_CODE_SKIP_FOUNDRY_AUTH; ANTHROPIC_AWS_API_KEY only under Anthropic-on-AWS mode without its matching skip-auth flag; AWS credential/config vars (static keys, STS web identity, container credentials, profile/region handles, AWS_BEARER_TOKEN_BEDROCK) only when at least one AWS provider mode requires native auth; and GOOGLE_APPLICATION_CREDENTIALS only when at least one Google provider mode requires native auth. Captured stderr and the verbose file transcript are secret-scrubbed before write (scrubSecrets/makeSecretScrubber): credential-shaped patterns (JWT, provider API keys, bearer/PAT tokens) and the literal values of secret-named env vars are replaced with [REDACTED]. Claude stderr scrubbing reads the unfiltered SDK env bag so a stripped forge token that still appears on stderr is redacted."
    evidence_command: "node --import tsx --test --test-reporter=dot packages/pelaggio/scripts/pelaggio/__tests__/secret-hygiene.test.ts packages/pelaggio/scripts/pelaggio/__tests__/claude-seat.test.ts packages/pelaggio/scripts/pelaggio/__tests__/claude-seat-env-conformance.test.ts"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/claude-seat-env-conformance.test.ts"
    failure_mode: "deny-by-default env; redacted before write"
    known_limits: "The env allowlist covers spawned driver subprocesses (codex, grok, opencode, contained-execution, and Claude at spawnClaudeSeat). Pelaggio's own git/gh helper commands still use the repo env by design. Claude seats still receive the provider-independent SDK-listed WIF/profile inputs and credentials for a selected provider mode only when its matching skip-auth flag is disabled so the CLI can authenticate. Proxy configuration (HTTP_PROXY/HTTPS_PROXY/NO_PROXY and lowercase forms) is DENIED to every seat: a proxy URL can carry userinfo credentials, so the grant ships only with the value-conditional gate that refuses a credentialed proxy — operators behind a proxy must opt in via security.env-allowlist until then. Seat env denial bounds what the harness hands a seat, not what the seat can reach: spawnClaudeSeat unshares PID and mount but not network, so the seat retains the host network, including link-local. Explicit metadata-service credential opt-outs (AWS_EC2_METADATA_DISABLED, METADATA_SERVER_DETECTION) are preserved, but an operator that leaves them unset still relies on the #610 runner route denial for 169.254.0.0/16. Forge denial covers what the harness hands a seat — env vars and GitHub CLI config directories. It does not cover a credential written to disk by CI: actions/checkout persists the job token as an http.<host>.extraheader in the checkout's .git/config, and the seat binds the host root, so a denied pr-review/pr-verify seat can still recover it and post a commit status. #658 splits that credential out of the checkout; until it lands, the denial is narrower than the role table implies. Env denial is not file denial: the seat keeps a bound host root, so leftover host credential files (~/.git-credentials, ~/.netrc, ~/.ssh) stay readable, and the ssh-agent socket remains connectable by its filesystem path even though the SSH_AUTH_SOCK variable is stripped — both are #572 residuals. Scrubbing is pattern- and configured-value-based — a novel credential format that matches no pattern and is not a known secret env value could still reach a log. Not the full #176/#572 out-of-process credential broker."
    standards: ["OWASP-LLM02", "12FACTOR-Config"]
    adr: "ADR-10"
    last_verified: "2026-08-27"

  # ---- The defining threat, as a first-class claim --------------------------
  - id: TC-015
    claim: "Pelaggio treats everything in your repo, issues, and PRs as untrusted input — text that could be trying to steer the agent — and bounds what it can do accordingly."
    status: best_effort        # partially: worktree hooks + gates; not yet a designed injection defense
    applies_to: ">=0.1.0 (best_effort); hardening planned"
    mechanism: "Today: worktree hooks (TC-011), fail-closed review gate (TC-003), and budget/turn caps bound blast radius. Not yet: a designed prompt-injection defense (input provenance, tool-scoping by trust level, output handling)."
    evidence_command: "grep -rEn 'PreToolUse|parseReviewFindings|TURN_LIMITS|BUDGETS|SECURITY_PATHS|prompt injection' packages/pelaggio/scripts/pelaggio docs/trust"
    test_file: "planned — injection corpus / red-team fixtures"
    failure_mode: "bounded by the gates above, not by injection-specific detection"
    known_limits: "This is the DEFINING threat and the honest weak point: the agent runs allow-all tools over attacker-reachable content. Hardening (least-privilege tools, human gates on risky file classes) is the roadmap headline."
    standards: ["OWASP-LLM01", "OWASP-LLM05", "OWASP-Agentic-2025"]
    adr: "ADR-2"
    last_verified: "2026-07-07"

  # ---- Supply-chain honesty -------------------------------------------------
  - id: TC-016
    claim: "We tell you the truth about the dependency tree: our package ships no install scripts, but transitive dependencies can, on a normal install."
    status: best_effort
    applies_to: ">=0.1.0"
    mechanism: "TC-004 governs our manifest; consumer/CI installs run without --ignore-scripts except pr-review.yml, so transitive lifecycle scripts still execute."
    evidence_command: "grep -rEn 'ignore-scripts' .github/workflows"
    test_file: "n/a"
    failure_mode: "documented, not gated"
    known_limits: "Also: LINEAR_API_KEY has no standard prefix and isn't in the tarball secret scan (M1)."
    standards: ["SLSA-BuildL3", "OWASP-LLM03"]
    adr: "ADR-6"
    last_verified: "2026-07-07"

  - id: TC-017
    claim: "Opt-in contained egress reaches only a reviewed provider route through a host-held, capped broker; the jail receives no provider key or upstream URL."
    status: guarantee
    applies_to: ">=0.1.0"
    condition: "run-contained with --egress"
    mechanism: "bubblewrap retains --unshare-all and mounts only a Unix HTTP socket. The host broker enforces an HTTPS origin, exact method/path/model policy, bounded buffered bodies, integer token/spend reservations, redirect refusal, response-header filtering, and one-shot scope termination on hard-cap or accounting failure."
    evidence_command: "node --import tsx --test --test-reporter=dot packages/pelaggio/scripts/pelaggio/__tests__/egress-broker.test.ts packages/pelaggio/scripts/pelaggio/__tests__/contained-execution.test.ts"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/{egress-broker,contained-execution,run-contained-cli}.test.ts"
    failure_mode: "deny the request, or seal the broker and kill the contained scope when accounting cannot remain safe"
    known_limits: "The provider is an allowed sink, so prompt/body exfiltration to it remains possible. Codex key mode is the only advertised production policy; transparent auth is conformance-only pending a verified official transport seam."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: null
    last_verified: "2026-07-19"

  - id: TC-018
    claim: "On Linux, every Claude Agent SDK CLI child starts in a detached Bubblewrap PID + mount namespace: it cannot address the harness PID, inherit the harness controlling terminal, or see configured harness-only Unix-socket directories; missing Bubblewrap or a non-Linux host fails the step closed."
    status: guarantee
    applies_to: ">=0.1.0"
    condition: "provider = claude"
    mechanism: "claudeRunStep preflights a bwrap from the host PATH only when its real executable and full directory ancestry are root-owned, have no group/world write bits, and are not writable by a non-root invoking user; user-writable PATH entries are ignored. Before query(), it runs a zero-spend capability probe with the same namespace, mount arguments, and filtered child env. It always supplies spawnClaudeCodeProcess → spawnClaudeSeat with the Step role. The wrapper uses --unshare-pid, --proc /proc, --new-session, --dev-bind / / (so required device nodes remain usable), and --tmpfs on each dedicated harness-only socket parent from HARNESS_ONLY_SOCKET_ENVS (read from the harness env) plus, for forge-denied roles, each existing GitHub CLI config directory (GH_CONFIG_DIR, $XDG_CONFIG_HOME/gh, $HOME/.config/gh). Existing socket parents are canonicalized before the wide-parent policy is applied; missing GitHub config directories are skipped. The child env is deny-by-default via buildAgentEnv; forge/remote vars are extra-passed only for pick/ship/shipwreck. Session binding records the outer bwrap PID."
    evidence_command: "node --import tsx --test --test-reporter=dot packages/pelaggio/scripts/pelaggio/__tests__/claude-seat.test.ts"
    test_file: "packages/pelaggio/scripts/pelaggio/__tests__/claude-seat.test.ts"
    failure_mode: "fail the Claude step closed (subtype error_confinement); no unisolated fallback"
    known_limits: "Not a full OS/container sandbox: the seat still has the host network namespace and a bound host root (minus /proc, masked socket parents, and masked GitHub CLI config directories for denied roles). Anthropic/CLI auth names still reach the child because it is the API client. Leftover host credential files such as ~/.git-credentials, ~/.netrc, ~/.ssh, and ~/.claude remain readable by absolute path; enumerating them is #572, not a capability broker. Writes outside Git roots remain outside TC-011. Codex/Grok/OpenCode are not covered. CLAUDE_CAPABILITIES.isolation stays empty because this is harness wrapping, not a provider-native isolation mechanism."
    standards: ["OWASP-LLM06", "ASVS-V4"]
    adr: null
    last_verified: "2026-08-26"

manifest:
  defaults:
    ship_target: pull-request
    telemetry: off
    control_plane_auth: required
  capabilities:
    - id: repo.read
      description: "Read repository files, local configuration, and roadmap context needed to plan or verify work."
      default: allowed
      scope: local_repo_only
      approval: not_required
      evidence: [TC-015]
    - id: repo.write.worktree
      description: "Create/edit files while working an item."
      default: allowed
      scope: item_worktree_only
      approval: not_required
      evidence: [TC-011, TC-015]
    - id: shell.exec.worktree
      description: "Run shell commands while working an item. The high-trust capability; scoped to the worktree and bounded by budget/turn caps."
      default: allowed
      scope: item_worktree_only
      approval: not_required
      evidence: [TC-011, TC-015]
    - id: pr.open
      description: "Open a pull request with the item's work."
      default: allowed
      approval: not_required
      evidence: [TC-003, TC-012]
    - id: git.push.default_branch
      description: "Push directly to the repo's default branch."
      default: denied
      approval: explicit_config_required
      evidence: [TC-012]
    - id: pr.automerge
      description: "Auto-merge a PR once checks pass."
      default: denied
      approval: explicit_config_required
      evidence: [TC-013]
    - id: control_plane.spawn_run
      description: "Spawn an orchestrator run via the control-plane API."
      default: denied
      scope: authenticated
      approval: explicit_config_required
      evidence: [TC-010]
  egress:
    - destination: anthropic
      data_categories: [prompts, repo_paths, source_context, diffs, issue_text]
      required: true
      retention: "governed by the provider's policy"
      opt_out: "configure a different model provider when one is supported"
      role: sub_processor
      evidence: [TC-006]
    - destination: openai
      data_categories: [prompts, request_bodies, provider_usage]
      required: false
      retention: "governed by the provider's policy"
      opt_out: "omit the run-contained egress selection"
      role: sub_processor
      evidence: [TC-006, TC-017]
    - destination: cli-chat-proxy.grok.com
      data_categories: [prompts, source_context, read_file_context]
      required: false
      retention: "governed by the provider's policy"
      opt_out: "configure a different model provider for the step"
      role: sub_processor
      evidence: [TC-006, TC-014]
    - destination: github
      data_categories: [issues, pull_requests, plan_bodies, diffs, comments]
      required: false
      retention: "your GitHub"
