pre-commit:
  # Sequential: biome may rewrite and re-stage files; the guards then read the staged snapshot.
  piped: true
  commands:
    biome:
      glob: "{packages/*/scripts/**/*.ts,scripts/**/*.ts}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    guards:
      # The two ~1 s conformance tests behind the review gate's guard-config lens, run at
      # authoring time so a layering violation or an unregistered .dev path is refused before a
      # gate roll, not $40 later (guarded-actions.md §8.1 "early"). Delta-scoped: the script
      # tests the staged tree, so unstaged state elsewhere cannot cause a refusal (§8.1 "narrow").
      glob: "{packages/pelaggio/scripts/**/*.{ts,mjs},packages/server/src/**/*.{ts,mjs},ci/guards-staged.sh}"
      run: bash ci/guards-staged.sh
